services:
  - type: web
    name: timebank-india
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    # Note: To enable a persistent SSD disk for SQLite across container restarts,
    # upgrade plan to 'starter' and uncomment the disk section below:
    # disk:
    #   name: timebank-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
